name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # =========================
  # Stage 1: Test
  # =========================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run unit tests
        run: dotnet test --no-restore --verbosity normal

  # =========================
  # Stage 2: Build
  # =========================
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build project
        run: dotnet build --configuration Release

      - name: Create artifact
        run: echo "Build completed successfully" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: artifact.txt

  # =========================
  # Stage 3: Deploy to Staging
  # =========================
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          cat artifact.txt

  # =========================
  # Stage 4: Verify Staging
  # =========================
  verify_staging:
    runs-on: ubuntu-latest
    needs: deploy_staging
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run smoke tests
        run: dotnet test Calculator.Tests/Calculator.Tests.csproj --filter "FullyQualifiedName~SmokeTest" --no-restore --verbosity normal

  # =========================
  # Stage 5: Deploy to Production
  # =========================
  deploy_production:
    runs-on: ubuntu-latest
    needs: verify_staging
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          cat artifact.txt